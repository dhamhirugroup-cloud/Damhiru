<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ධම්හිරු රංගායතනය - අප පිළිබඳව</title>
    <style>
        :root {
            --bg: #0f0f12;
            --card-bg: #1a1a24;
            --accent: #ffb703;
            --text: #f1f1f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 2rem;
        }

        /* Top Toolbar Styles */
        .toolbar {
            background-color: #14141d;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .left-header {
            display: flex;
            align-items: center;
        }

        .toolbar-title {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Hamburger Menu Button */
        .menu-btn {
            font-size: 26px;
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            margin-right: 18px;
            transition: transform 0.2s ease, color 0.2s ease;
            line-height: 1;
        }

        .menu-btn:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        /* Side Drawer Menu */
        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 270px;
            height: 100%;
            background-color: #14141d;
            border-right: 2px solid var(--accent);
            box-shadow: 5px 0 25px rgba(255, 183, 3, 0.2);
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding-top: 80px;
        }

        .drawer.open {
            left: 0;
        }

        /* Menu Links */
        .drawer a {
            display: flex;
            align-items: center;
            padding: 16px 30px;
            color: var(--text);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border-left: 4px solid transparent;
            transition: all 0.25s ease;
        }

        .drawer a:hover {
            background-color: #1e1e2c;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 38px;
        }

        /* Background Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Main Container for Content */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Toolbar -->
    <div class="toolbar">
        <div class="left-header">
            <button class="menu-btn" onclick="toggleDrawer()">&#9776;</button>
            <span class="toolbar-title">ධම්හිරු රංගායතනය</span>
        </div>
    </div>

    <!-- Side Drawer Menu -->
    <div class="drawer" id="sideDrawer">
        <a href="Damhiru.html">මුල් පිටුව</a>
        <a href="Hi1.html">අප පිළිබඳව</a>
        <a href="About.html">විමසීම්</a>
        <a href="#">Whatsapp</a>
        <a href="#">Facebook</a>
    </div>

    <!-- Background Overlay -->
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <!-- Main Content Area -->
    <main class="main-container">
        <h2>අප පිළිබඳව</h2>
        <p style="margin-top: 15px; color: #a0a0b0;">මෙම පිටුවෙන් අප ආයතනය පිළිබඳ තොරතුරු ලබාගත හැක.</p>
    </main>

    <!-- Menu Toggle Logic -->
    <script>
        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
  
</body>
</html>
